# ---------------------------------------------------------------------------
# Allure report (needs Java in image — skip if unavailable)
# ---------------------------------------------------------------------------
allure_report:
  stage: report
  image: mcr.microsoft.com/playwright:v1.49.0-jammy
  needs:
    - job: ui_chromium
      optional: true
      artifacts: true
    - job: api_tests
      optional: true
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
  allow_failure: true
  script:
    - apt-get update -qq && apt-get install -y -qq default-jre-headless || true
    - npm ci
    - |
      if [ -d allure-results ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
        npm run allure:generate
      else
        echo "No allure-results found; skipping generation"
        mkdir -p allure-report
        echo "No results" > allure-report/README.txt
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - allure-report/
