<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dummy Shop — Overview</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-left"><h1>DUMMY SHOP</h1></div>
  </header>

  <main class="checkout_summary_container">
    <h2 class="title">Checkout: Overview</h2>
    <div class="cart_list"></div>
    <div class="summary_info">
      <div class="summary_subtotal_label"></div>
      <div class="summary_tax_label"></div>
      <div class="summary_total_label"></div>
    </div>
    <div class="cart_footer">
      <a class="btn secondary" data-test="cancel" href="/inventory.html">Cancel</a>
      <button data-test="finish" type="button">Finish</button>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
