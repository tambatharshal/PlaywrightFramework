<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dummy Shop — Login</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-left"><h1>DUMMY SHOP</h1></div>
  </header>

  <div class="login_container">
    <div class="login-box">
      <h2>Login</h2>
      <form id="login-form">
        <label for="user-name">Username</label>
        <input id="user-name" data-test="username" placeholder="standard_user" />

        <label for="password">Password</label>
        <input id="password" type="password" data-test="password" placeholder="secret_sauce" />

        <button id="login-button" data-test="login-button" type="submit">Login</button>
      </form>
      <p style="color:#5c6b73;font-size:0.9rem;margin-top:1rem;">
        Try <code>standard_user</code> / <code>secret_sauce</code> or <code>locked_out_user</code>.
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
