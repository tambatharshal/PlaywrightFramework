<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dummy Shop — Cart</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button id="react-burger-menu-btn" type="button">☰</button>
      <h1>DUMMY SHOP</h1>
    </div>
    <a class="shopping_cart_link" href="/cart.html">
      🛒<span class="shopping_cart_badge" style="display:none"></span>
    </a>
  </header>

  <div class="bm-menu-wrap">
    <a id="logout_sidebar_link" href="/">Logout</a>
  </div>

  <main class="cart_contents_container">
    <h2 class="title">Your Cart</h2>
    <div class="cart_list"></div>
    <div class="cart_footer">
      <a class="btn secondary" data-test="continue-shopping" href="/inventory.html">Continue Shopping</a>
      <button data-test="checkout" type="button">Checkout</button>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
