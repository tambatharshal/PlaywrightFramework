<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dummy Shop — Checkout Info</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-left"><h1>DUMMY SHOP</h1></div>
  </header>

  <main class="checkout_info_wrapper">
    <div class="info-panel">
      <h2 class="title">Checkout: Your Information</h2>
      <form id="checkout-info-form">
        <label>First Name</label>
        <input data-test="firstName" />
        <label>Last Name</label>
        <input data-test="lastName" />
        <label>Postal Code</label>
        <input data-test="postalCode" />
        <div style="display:flex;gap:0.75rem;">
          <a class="btn secondary" data-test="cancel" href="/cart.html">Cancel</a>
          <button data-test="continue" type="submit">Continue</button>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
