name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - prod
          - local
      suite:
        description: 'Test suite'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ui
          - api

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, api]
        # Uncomment for cross-browser CI:
        # project: [chromium, firefox, webkit, api]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: matrix.project != 'api'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          ENV: ${{ github.event.inputs.environment || 'qa' }}
          CI: true
          # Inject secrets in GitHub → Settings → Secrets:
          # DB_HOST: ${{ secrets.DB_HOST }}
          # DB_USER: ${{ secrets.DB_USER }}
          # DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          SUITE="${{ github.event.inputs.suite || 'all' }}"
          if [ "$SUITE" = "ui" ] && [ "${{ matrix.project }}" = "api" ]; then
            echo "Skipping API project for UI-only suite"
            exit 0
          fi
          if [ "$SUITE" = "api" ] && [ "${{ matrix.project }}" != "api" ]; then
            echo "Skipping UI project for API-only suite"
            exit 0
          fi
          npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: |
            test-results/
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 14

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.project }}
          path: allure-report/
          retention-days: 14
